# Keep the legacy project name so existing persistent volumes remain attached.
name: openwehr

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTORUN_ENABLED=true
      - APP_NAME=WehrPortal
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - APP_TIMEZONE=Europe/Berlin
      - APP_LOCALE=de
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=openwehr
      - DB_USERNAME=openwehr
      - DB_PASSWORD=secret
      - SESSION_DRIVER=database
      - SESSION_COOKIE=openwehr-session
      - SESSION_LIFETIME=129600
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - CACHE_PREFIX=openwehr-cache-
      - REDIS_PREFIX=openwehr-database-
      - MAGIC_LINK_TTL_MINUTES=15
      - MAIL_MAILER=log
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      - AUTORUN_ENABLED=false
      - APP_NAME=WehrPortal
      - APP_ENV=local
      - APP_TIMEZONE=Europe/Berlin
      - APP_LOCALE=de
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=openwehr
      - DB_USERNAME=openwehr
      - DB_PASSWORD=secret
      - SESSION_DRIVER=database
      - SESSION_COOKIE=openwehr-session
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - CACHE_PREFIX=openwehr-cache-
      - REDIS_PREFIX=openwehr-database-
      - MAGIC_LINK_TTL_MINUTES=15
      - MAIL_MAILER=log
    depends_on:
      - app
      - redis

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openwehr
      POSTGRES_USER: openwehr
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwehr -d openwehr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  app_storage:
