# Replaces the base image's server-opts.d/security.conf.
#
# The app sets its security headers itself (App\Http\Middleware\SecurityHeaders). The base image
# added X-Frame-Options to every response, which kept the public calendar out of the Wehr's own
# website, and HSTS with includeSubDomains even over plain HTTP. Here only what also has to hold
# for files nginx serves without PHP.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# Hidden files and directories, except /.well-known/ (RFC 8615)
location ~ /\.(?!well-known) {
    deny all;
}

# Files that may expose sensitive information
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
