name: WehrPortal Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  checks:
    name: Release Checks
    if: vars.PUBLISH_IMAGES == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml

  release:
    name: Build Image & Create Release
    needs: checks
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag matches config/app.php
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION=$(grep -oP "(?<='version' => ')V\.[0-9]+(\.[0-9]+){1,3}(?=')" config/app.php)
          EXPECTED_TAG="v${APP_VERSION#V.}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: Tag $TAG does not match version $APP_VERSION in config/app.php"
            echo "Expected tag: $EXPECTED_TAG"
            exit 1
          fi
          echo "Version validated: $APP_VERSION → $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Preserve two to four version parts without semver normalization.
            type=ref,event=tag
            type=raw,value=latest

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: wehrportal:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wehrportal:release-scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="V.${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes --latest
          fi
