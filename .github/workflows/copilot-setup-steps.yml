# WehrPortal development environment.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wehrportal_test
          POSTGRES_USER: wehrportal
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wehrportal -d wehrportal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, gd, exif, bcmath, ctype, curl, dom, fileinfo, iconv, mbstring, openssl, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Prepare local environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=wehrportal_test/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=secret/' \
            -e 's/^MAIL_MAILER=.*/MAIL_MAILER=log/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      # Pest disables Vite in tests/TestCase.php; no Node install or asset build needed.
      # Migrations also enable btree_gist, including in Pest's parallel databases.
      - name: Prepare database
        run: php artisan migrate --force --no-interaction

      - name: Verify application boot
        run: php artisan route:list
