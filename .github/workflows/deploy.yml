name: WehrPortal CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openwehr_test
          POSTGRES_USER: openwehr
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: openwehr_test
      DB_USERNAME: openwehr
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, openssl, bcmath, gd, exif, zip
          coverage: none
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare Environment
        run: cp .env.example .env && php artisan key:generate
      - name: Configure PostgreSQL for Parallel Migrations
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec "$container" psql -U openwehr -d openwehr_test -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$container"
          for _ in {1..30}; do
            if docker exec "$container" pg_isready -U openwehr -d openwehr_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Configure Test Database
        run: php artisan migrate --env=testing --force
      - name: Validate Protection Manifest
        run: ./vendor/bin/pest tests/Unit/Extensions/Locations/ProtectionManifestTest.php tests/Feature/Extensions/Audit
      - name: Run Dateien Tests
        run: ./vendor/bin/pest tests/Feature/Extensions/Dateien
      - name: Run Locations Context and Readiness Regression Tests
        run: ./vendor/bin/pest tests/Feature/Extensions/Locations tests/Unit/Extensions/Locations
      - name: Compile Blade Views
        run: php artisan view:cache && php artisan view:clear
      - name: Run Regression Tests
        run: ./vendor/bin/pest --parallel

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, openssl, bcmath, gd, exif, zip
          coverage: none
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Environment
        id: prepare
        run: cp .env.example .env && php artisan key:generate
      - name: Composer Audit
        run: composer audit --no-interaction
      - name: Static Analysis
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=table
      - name: Dateien Static Analysis
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/phpstan analyse -c extensions/Dateien/phpstan.neon --memory-limit=2G --no-progress --error-format=table
      - name: Dateien Code Style
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/pint --test extensions/Dateien tests/Feature/Extensions/Dateien
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm Dependencies
        run: npm ci --no-audit --no-fund
      - name: npm Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    # Publishing is opt-in. No workflow calls a production deployment webhook.
    if: github.event_name == 'push' && vars.PUBLISH_IMAGES == 'true'
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: wehrportal:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wehrportal:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
