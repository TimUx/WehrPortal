name: WehrPortal CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wehrportal_test
          POSTGRES_USER: wehrportal
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: wehrportal_test
      DB_USERNAME: wehrportal
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, openssl, bcmath, gd, exif, zip
          coverage: none
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare Environment
        run: cp .env.example .env && php artisan key:generate
      - name: Configure PostgreSQL for Parallel Migrations
        run: |
          container="${{ job.services.postgres.id }}"
          docker exec "$container" psql -U wehrportal -d wehrportal_test -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$container"
          for _ in {1..30}; do
            if docker exec "$container" pg_isready -U wehrportal -d wehrportal_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Configure Test Database
        run: php artisan migrate --env=testing --force
      - name: Compile Blade Views
        run: php artisan view:cache && php artisan view:clear
      - name: Run Regression Tests
        run: ./vendor/bin/pest --parallel

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, openssl, bcmath, gd, exif, zip
          coverage: none
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Environment
        id: prepare
        run: cp .env.example .env && php artisan key:generate
      - name: Composer Audit
        run: composer audit --no-interaction
      - name: Static Analysis
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=table
      - name: Dateien Static Analysis
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/phpstan analyse -c extensions/Dateien/phpstan.neon --memory-limit=2G --no-progress --error-format=table
      - name: Dateien Code Style
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: ./vendor/bin/pint --test extensions/Dateien tests/Feature/Extensions/Dateien
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm Dependencies
        run: npm ci --no-audit --no-fund
      - name: npm Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build Assets
        run: npm run build
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v3
        if: ${{ github.event_name != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
