name: Build & Deploy

on:
  push:
    branches: [main]
    # The project page in docs/ (GitHub Pages) needs no tests and no new image
    paths-ignore:
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roberteinsle/openwehr

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        # Authenticated pulls have a much higher Docker Hub rate limit than anonymous ones
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: openwehr_test
          POSTGRES_USER: openwehr
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring, openssl, bcmath, gd, exif
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Configure Test Database
        run: |
          php artisan migrate --env=testing --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: openwehr_test
          DB_USERNAME: openwehr
          DB_PASSWORD: secret

      - name: Run Tests
        run: ./vendor/bin/pest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: openwehr_test
          DB_USERNAME: openwehr
          DB_PASSWORD: secret

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The base image comes from Docker Hub; logged-in pulls avoid its anonymous rate limit
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Without the repository variable (not a secret) the deploy is skipped; say so on the run page
      - name: Coolify Deployment skipped
        if: ${{ vars.COOLIFY_DEPLOY_ENABLED != 'true' }}
        run: echo "::notice title=Coolify::Deployment skipped – repository variable COOLIFY_DEPLOY_ENABLED is not 'true' (Settings → Secrets and variables → Actions → Variables)."

      # A refused webhook (wrong URL or token, Coolify down) fails the job instead of passing silently
      - name: Trigger Coolify Deployment
        if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::error title=Coolify::Secret COOLIFY_DEPLOY_WEBHOOK or COOLIFY_WEBHOOK_TOKEN is missing."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" --max-time 60 -X POST "$WEBHOOK" -H "Authorization: Bearer $TOKEN") || {
            echo "::error title=Coolify::Webhook not reachable."
            exit 1
          }
          echo "Coolify answered HTTP $status"
          cat response.txt; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Coolify::Webhook refused with HTTP $status."
            exit 1
          fi
