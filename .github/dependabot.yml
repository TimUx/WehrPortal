# Keeps the dependencies current: one pull request per week and ecosystem with the patch and
# minor updates grouped; security updates come at once (Dependabot security updates). Every pull
# request runs the tests and the security checks of the "Build & Deploy" workflow.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # The base image (PHP, nginx, Alpine) of the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
